name: Quality

on:
  workflow_call:
    outputs:
      tested-sha:
        value: ${{ jobs.z1-gate.outputs.tested-sha }}

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: "1.3.11"
  WRANGLER_SEND_METRICS: "false"
  CI: "true"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run typecheck

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run lint

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check SHA-pinned workflow actions
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = ".github/workflows";
            const shaRe = /@[0-9a-f]{40}(\s|$|#)/;
            const bad = [];
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith(".yml") && !f.endsWith(".yaml")) continue;
              const text = fs.readFileSync(path.join(dir, f), "utf8");
              for (const m of text.matchAll(/^\s*-?\s*uses:\s*([^\s#]+)/gm)) {
                const ref = m[1];
                if (ref.startsWith("./")) continue;
                if (!shaRe.test(ref)) bad.push(`${f}: ${ref}`);
              }
            }
            if (bad.length) {
              console.error("Unpinned uses:\n" + bad.join("\n"));
              process.exit(1);
            }
          '

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
      - run: gitleaks dir . --no-banner --redact --log-level error

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
      - run: osv-scanner scan --config osv-scanner.toml --lockfile=bun.lock

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run build

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun turbo build --filter=@bogo/shared && bun run test:unit:coverage

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - runtime verified via Integration API suite"

  l3-integration:
    name: "L3: Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run build && bun turbo test:e2e --filter=@bogo/worker

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
      - run: bun run build
      - name: Install Playwright Chromium
        run: cd packages/ui && bunx playwright install --with-deps chromium
      - name: Run Playwright browser E2E
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e:pw -- --reporter=line,html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: playwright-report
          path: packages/ui/playwright-report/
          retention-days: 7

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - deployed as Cloudflare Worker, not an npm package"

  coverage-gates:
    name: "Coverage Gates (routes / pages / clip.yaml)"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bogo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nocoo/clip
          path: clip
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
          working-directory: bogo
      - name: Route coverage gate
        working-directory: bogo
        run: bun run gate:routes
      - name: Page coverage gate
        working-directory: bogo
        run: bun run gate:pages
      - name: Clip YAML completeness gate
        working-directory: bogo
        env:
          BOGO_REQUIRE_CLI_E2E: "1"
        run: bun run gate:clip-yaml

  cli-e2e:
    name: "CLI E2E (clip-generated bogo CLI)"
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bogo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nocoo/clip
          path: clip
      - uses: nocoo/base-ci/.github/actions/setup-js@6424d395d36a815d931f10e557762eb635d511c0 # v2026.16
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          install-policy: trusted
          working-directory: bogo
      - name: Build packages
        working-directory: bogo
        run: bun run build
      - name: Run clip-generated CLI E2E
        working-directory: bogo
        env:
          BOGO_REQUIRE_CLI_E2E: "1"
        run: bun run test:cli-e2e

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
      - coverage-gates
      - cli-e2e
    outputs:
      tested-sha: ${{ github.sha }}
    steps:
      - name: Verify all quality slots
        run: |
          echo "s1-types: ${{ needs.s1-types.result }}"
          echo "s2-lint: ${{ needs.s2-lint.result }}"
          echo "s3-workflow: ${{ needs.s3-workflow.result }}"
          echo "g1-secrets: ${{ needs.g1-secrets.result }}"
          echo "g2-dependencies: ${{ needs.g2-dependencies.result }}"
          echo "b1-build: ${{ needs.b1-build.result }}"
          echo "l1-unit: ${{ needs.l1-unit.result }}"
          echo "l2-runtime: ${{ needs.l2-runtime.result }}"
          echo "l3-integration: ${{ needs.l3-integration.result }}"
          echo "l4-e2e: ${{ needs.l4-e2e.result }}"
          echo "p1-package: ${{ needs.p1-package.result }}"
          echo "coverage-gates: ${{ needs.coverage-gates.result }}"
          echo "cli-e2e: ${{ needs.cli-e2e.result }}"
          for r in \
            "${{ needs.s1-types.result }}" \
            "${{ needs.s2-lint.result }}" \
            "${{ needs.s3-workflow.result }}" \
            "${{ needs.g1-secrets.result }}" \
            "${{ needs.g2-dependencies.result }}" \
            "${{ needs.b1-build.result }}" \
            "${{ needs.l1-unit.result }}" \
            "${{ needs.l3-integration.result }}" \
            "${{ needs.l4-e2e.result }}" \
            "${{ needs.coverage-gates.result }}" \
            "${{ needs.cli-e2e.result }}"; do
            if [ "$r" != "success" ]; then
              echo "Required slot failed or was skipped: $r"
              exit 1
            fi
          done
          for r in \
            "${{ needs.l2-runtime.result }}" \
            "${{ needs.p1-package.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "Optional slot failed: $r"
              exit 1
            fi
          done
