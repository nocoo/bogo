name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || '' }}
      package-version-match: ${{ github.event_name != 'workflow_run' }}
      runtime-version: "1.3.11"
      install-policy: "trusted"
      build-command: "bun run build"
      wrangler-version: "4.103.0"
      wrangler-working-directory: "packages/worker"
      d1-migrations: true
      d1-command: "d1 migrations apply bogo --remote --env production"
      deploy-command: deploy --env production
      environment: production
      concurrency-group: deploy-worker-production
      timeout-minutes: 15
      verify-command: |
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://bogo.hexly.ai/api/live)
        test "$STATUS" = "200"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
