name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.11"
      install-policy: "trusted"
      test-command: "bun run test:unit:coverage"
      coverage-path: "packages/*/coverage"
      osv-config: "osv-scanner.toml"

  coverage-gates:
    name: "Coverage Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bogo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bogo
          persist-credentials: false
      - name: Checkout clip (sibling for clip.yaml validation)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nocoo/clip
          path: clip
          persist-credentials: false
      - name: Setup bogo
        uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.3.11"
          working-directory: bogo
          install-policy: "trusted"
      - name: Setup clip
        uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.3.11"
          working-directory: clip
          install-policy: "project"
      - name: "G: Route coverage (L2)"
        run: cd bogo && bun run gate:routes
      - name: "G: Page coverage (L3)"
        run: cd bogo && bun run gate:pages
      - name: "G: clip.yaml validates against generator"
        env:
          BOGO_REQUIRE_CLI_E2E: "1"
        run: cd bogo && bun run gate:clip-yaml

  l2-e2e:
    name: "L2 Worker E2E"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.11"
      install-policy: "trusted"
      timeout-minutes: 15
      pre-command: "bun run build"
      command: "bun turbo test:e2e --filter=@bogo/worker"

  l3-playwright:
    name: "L3 Playwright E2E"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.3.11"
      install-policy: "trusted"
      browser: "chromium"
      browser-working-directory: "packages/ui"
      timeout-minutes: 20
      pre-command: "bun run build"
      command: "bun run test:e2e:pw"

  cli-e2e:
    name: "CLI E2E (clip-generated bogo CLI)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOGO_REQUIRE_CLI_E2E: "1"
    steps:
      - name: Checkout bogo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bogo
          persist-credentials: false
      - name: Checkout clip (sibling, fallback runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nocoo/clip
          path: clip
          persist-credentials: false
      - name: Setup bogo
        uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.3.11"
          working-directory: bogo
          install-policy: "trusted"
      - name: Setup clip
        uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.3.11"
          working-directory: clip
          install-policy: "project"
      - name: Build static (wrangler needs packages/worker/static)
        run: cd bogo && bun run build
      - name: "CLI E2E: login + CRUD + revoke"
        run: cd bogo && bun run test:cli-e2e
