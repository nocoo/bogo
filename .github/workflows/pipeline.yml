name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
    with:
      runtime-version: "1.3.11"
      install-policy: "trusted"
      artifact-name: b1-worker-bundle
      artifact-path: .
      artifact-unpack-command: tar -xzf b1-worker-bundle.tar.gz && rm -f b1-worker-bundle.tar.gz
      wrangler-working-directory: "packages/worker"
      d1-migrations: true
      d1-command: "d1 migrations apply bogo --remote --env production"
      deploy-command: deploy --env production
      environment: production
      concurrency-group: deploy-bogo-production
      timeout-minutes: 15
      verify-command: |
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://bogo.hexly.ai/api/live)
        test "$STATUS" = "200"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
